<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iceibank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="terminal" id="terminal">

  <div class="cabecalho">
    <span class="marca">iceibank</span>
    <span class="rotulo-agencia" id="rotulo-agencia"></span>
  </div>

  <div class="log" id="log">
    <div class="log-conteudo" id="log-conteudo"></div>
  </div>

  <div class="entrada">
    <span class="prompt" id="prompt" hidden></span>
    <span class="chevron">&gt;</span>
    <div class="campo">
      <div class="fantasma" aria-hidden="true"><span class="digitado" id="fantasma-digitado"></span><span class="restante" id="fantasma-restante"></span></div>
      <input id="cmd" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="comando">
    </div>
  </div>

</div>

<script src="./app.js"></script>
</body>
</html>
